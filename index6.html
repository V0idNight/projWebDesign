<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos do JavaScript</title>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }

    section {
      background-color: white;
      border: 1px solid #ccc;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    button {
      padding: 6px 12px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Recursos do JavaScript</h1>

  <section>
    <h2>1. Eventos HTML</h2>
    <button onclick="mostrarMensagem()">Clique aqui (onclick)</button>
    <p id="caixa" onmouseover="mudarCor('lightyellow')" onmouseout="mudarCor('white')">
      Passe o mouse aqui (onmouseover / onmouseout)
    </p>
    <input type="text" id="texto" placeholder="Digite algo (onkeyup)" onkeyup="mostrarTexto()">
    <p id="eco"></p>
    <p id="mensagem"></p>
  </section>

  <section>
    <h2>2. Manipulação de DOM</h2>
    <button onclick="adicionarItem()">Adicionar item</button>
    <button onclick="removerItem()">Remover último item</button>
    <button onclick="trocarTitulo()">Trocar título da página</button>
    <ul id="lista"></ul>
  </section>
  
  <section>
    <h2>3. Manipulação de Janela</h2>
    <p id="tamanho"></p>
    <button onclick="abrirJanela()">Abrir nova janela</button>
    <button onclick="fecharJanela()">Fechar nova janela</button>
    <button onclick="confirmarSaida()">Confirmar (window.confirm)</button>
    <button onclick="voltarAoTopo()">Rolar para o topo</button>
  </section>

  <script src="script1.js"></script>
</body>
</html>
