<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos do JavaScript</title>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .modoClaro {
      background-color: white;
      color: black;
      border: 3px solid blue;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    #tamanho {
      white-space: pre-line;
    }

    button {
      padding: 6px 12px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Recursos do JavaScript</h1>

  <section>
    <h2>1. Eventos HTML</h2>
    <button id="funcClick">Clique aqui (onclick)</button>
    <p id="mouseOverOut">Passe o mouse aqui.</p>
    <button onclick="mensagemPrompt()">Aperte aqui para escrever uma mensagem!</button>
    <p id="eco"></p>
    <p id="mensagem"></p>
  </section>

  <section>
    <h2>2. Manipulação de DOM</h2>
    <button onclick="adicionarItem()">Adicionar item</button>
    <button onclick="removerItem()">Remover último item</button>
    <button onclick="trocarTitulo()">Trocar título da página</button>
    <ul id="lista"></ul>
  </section>

  <section>
    <h2>3. Manipulação de Janela</h2>
    <p id="tamanho"></p>
    <button onclick="abrirJanela()">Abrir nova janela</button>
    <button onclick="fecharJanela()">Fechar nova janela</button>
    <button onclick="confirmarSaida()">Confirmar</button>
    <button onclick="voltarAoTopo()">Rolar para o topo</button>

    <h3>Temporizadores</h3>
    <p id="tempo">Aguardando...</p>
    <button onclick="IniciarTimeout()">Executar timeout.</button>
    <button id="CancelarTimeout" onclick="cancelarTimeout()">Cancelar Timeout</button>
    <p id="intervalo">Contador: 0</p>
    <button id="IniciarIntervalo" onclick="iniciarIntervalo()">Iniciar Contador</button>
    <button id="PararIntervalo" onclick="pararIntervalo()">Parar Contador</button>
  </section>

    <section>
      <h2>area de criação e remoção de elementos</h2>
      
        <input type="text" id="input-texto" placeholder="digite o texto do novo elemento">

        <button id="btn-create-element">1. createElement + appendChild</button>
        <button id="btn-create-textnode">2. createTextNode + appendChild</button>
        <button id="btn-append">3. append()</button>
        <button id="btn-prepend">4. prepend()</button>
        <button id="btn-remove">5. remove() (Remove o 1º)</button>
        <button id="btn-replace">6. replaceWith()</button>
            

            
        <h3>Lista de Elementos:</h3>
        <ul id="minha-lista">
        <li>Item Original</li>
        </ul>
    </section>

  <button onclick="classListToggle()">Modo Claro</button>

  <script src="script1.js"></script>
</body>

</html>
